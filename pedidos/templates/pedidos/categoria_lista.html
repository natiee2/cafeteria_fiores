{% extends 'pedidos/base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Gestión de Categorías</h2>
    <a href="{% url 'categoria_crear' %}" class="btn btn-success">+ Nueva Categoría</a>
</div>
<table class="table table-bordered bg-white">
    <thead><tr><th>Nombre</th><th>Activa</th><th>Acciones</th></tr></thead>
    <tbody>
    {% for c in categorias %}
        <tr>
            <td>{{ c.nombre }}</td>
            <td>{{ c.activa|yesno:"Sí,No" }}</td>
            <td>
                <a href="{% url 'categoria_detalle' c.id %}" class="btn btn-sm btn-info">Ver</a>
                <a href="{% url 'categoria_editar' c.id %}" class="btn btn-sm btn-warning">Editar</a>
                <a href="{% url 'categoria_eliminar' c.id %}" class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
